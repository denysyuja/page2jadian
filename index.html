<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Album</title>

    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
            url('https://i.pinimg.com/736x/5f/33/9e/5f339ec4c7ca8458c7e834ae32159a48.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .notebook {
            width: 100%;
            max-width: 400px;
            min-height: 550px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 15px 15px 0px rgba(255,182,193,0.8);
            border: 3px solid #ffb6c1;
            text-align: center;
        }

        h2 {
            font-family: 'Indie Flower', cursive;
            color: #ff4d6d;
        }

        p {
            font-size: 14px;
            color: #555;
        }

        .page { display: none; }
        .active { display: block; }

        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .photo-grid img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* VIDEO */
        .video-container {
            width: 100%;
            margin-top: 10px;
        }

        .video-container iframe {
            width: 100%;
            height: 260px;
            border-radius: 10px;
            border: none;
        }

        .nav-btns {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #ff758f; }
        button:disabled { background: #ccc; }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 480px) {
            .notebook {
                max-width: 90%;
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }

            p {
                font-size: 13px;
            }

            .video-container iframe {
                height: 200px;
            }

            .photo-grid img {
                height: 100px;
            }

            button {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="notebook">

    <!-- PAGE 1 -->
    <div class="page active" id="p1">
        <h2>Yayy makasih yaa! ❤️</h2>
        <img src="https://media.giphy.com/media/16bJmyPvRbCDu/giphy.gif" width="150">
        <p>Makasih ya udah mau nerima aku 🤍</p>
        <p><i>Geser ke halaman berikutnya ya...</i></p>
    </div>

    <!-- PAGE 2 -->
    <div class="page" id="p2">
        <h2>ini ada video yang udah aku buatin jugaa</h2>

        <div class="video-container">
            <iframe 
                src="https://drive.google.com/file/d/FILE_ID/preview"
                allow="autoplay"
                allowfullscreen>
            </iframe>
        </div>

        <p>This video is for u mommy, from ur baby 🥺</p>
    </div>

    <!-- PAGE 3 -->
    <div class="page" id="p3">
        <h2>Our Memories 💕</h2>

        <div class="photo-grid">
            <img src="https://via.placeholder.com/150">
            <img src="https://via.placeholder.com/150">
            <img src="https://via.placeholder.com/150">
            <img src="https://via.placeholder.com/150">
        </div>

        <p>Ini ada soundtrack yang bisa kamu nyalain yaa</p>

        <iframe
            style="border-radius:12px"
            src="https://open.spotify.com/embed/playlist/00h76MrPxPEVXQKyqTDEAb"
            width="100%"
            height="152"
            frameborder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>
    </div>

    <div class="nav-btns">
        <button id="prevBtn" onclick="handleBack()">Kembali</button>
        <button id="nextBtn" onclick="changePage(1)">Lanjut</button>
    </div>
</div>

<script>
    let currentPage = 1;
    const totalPages = 3;

    function changePage(step) {
        document.getElementById(`p${currentPage}`).classList.remove("active");
        currentPage += step;
        document.getElementById(`p${currentPage}`).classList.add("active");
        updateButtons();
    }

    function handleBack() {
        if (currentPage === 1) {
            window.location.href = "https://denysyuja.github.io/page2jadian/";
        } else {
            changePage(-1);
        }
    }

    function updateButtons() {
        if (currentPage === totalPages) {
            document.getElementById("nextBtn").innerText = "Selesai ❤️";
            document.getElementById("nextBtn").onclick = () => {
                alert("i love u mommy 💕");
            };
        } else {
            document.getElementById("nextBtn").innerText = "Lanjut";
            document.getElementById("nextBtn").onclick = () => changePage(1);
        }
    }
</script>

</body>
</html>
